# /etc/nginx/sites-available/horizonte-www.conf — Sitio institucional de la U.E. Horizonte
server {
    listen 80;
    listen [::]:80;
    server_name www.horizonte.internal horizonte.internal;

    root  /srv/horizonte/www;
    index index.html;

    # Registros propios del sitio (formato 'horizonte' definido en conf.d/horizonte-log.conf)
    access_log /var/log/nginx/horizonte-www.access.log horizonte;
    error_log /var/log/nginx/horizonte-www.error.log warn;

    # Sin www -> con www (una sola dirección oficial)
    if ($host = horizonte.internal) {
        return 301 http://www.horizonte.internal$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Estáticos: el navegador los guarda 7 días
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 7d;
        access_log off;
    }

    # Circulares: listado automático
    location /circulares/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Archivos ocultos (.git, .env…) nunca se publican
    location ~ /\. {
        deny all;
    }

    # Páginas de error propias, visibles solo como error
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { internal; }
    location = /50x.html { internal; }
}
